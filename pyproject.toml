[project]
name = "omniship"
version = "0.1.0"
description = "Universal release orchestration"
readme = "README.md"
authors = [
    { name = "Ata Sesli" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]
[project.urls]
Homepage = "https://github.com/0ctacity/omniship"
Repository = "https://github.com/0ctacity/omniship"
Issues = "https://github.com/0ctacity/omniship/issues"

[project.scripts]
omniship = "omniship.cli.app:cli"

[project.entry-points."omniship.plugins"]
core = "omniship.operations:register_core_plugin"
python = "omniship.plugins.python:register_python_plugin"
github = "omniship.plugins.github:register_github_plugin"
system = "omniship.plugins.system:register_system_plugin"
packaging = "omniship.plugins.packaging:register_packaging_plugin"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
