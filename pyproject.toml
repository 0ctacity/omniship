[project]
name = "omniship"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wipesides", email = "atasesli@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
omniship = "omniship.cli.app:cli"

[project.entry-points."omniship.plugins"]
core = "omniship.operations:register_core_plugin"
github = "omniship.operations.github:register_github_plugin"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
